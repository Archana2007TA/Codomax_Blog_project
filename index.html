<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <h1>DevBlog</h1>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Welcome to My Developer Blog</h2>
            <p>Sharing my learning journey through code.</p>
        </section>

        <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;">
            <input
                type="text"
                id="search-input"
                placeholder="Search blogs by title, content, or author..."
                style="flex: 1; min-width: 220px; padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-primary);"
            >
            <select
                id="category-filter"
                style="padding: 0.65rem 0.9rem; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-primary);"
            >
                <option value="All">All Categories</option>
                <option value="Web Development">Web Development</option>
                <option value="CSS & Design">CSS & Design</option>
                <option value="JavaScript">JavaScript</option>
                <option value="Backend & DB">Backend & DB</option>
            </select>
        </div>

        <section id="blog-container" class="blog-grid"></section>
    </main>

    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
