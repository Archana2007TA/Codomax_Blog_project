<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Article - DevBlog</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <nav>
            <h1>DevBlog</h1>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div style="max-width: 800px; margin: 0 auto 1.25rem auto;">
            <a href="index.html" class="read-more-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;">&larr; Back to All Posts</a>
        </div>

        <article id="single-post-container" class="form-container" style="max-width: 800px; margin-top: 0;">
            <span class="badge" id="post-category">Loading...</span>
            <h1 id="post-title" style="font-size: 2rem; line-height: 1.3; margin: 0.5rem 0 0.75rem 0;">Loading article...</h1>
            <p id="post-meta" style="color: var(--text-muted); font-size: 0.9rem; padding-bottom: 1.5rem; margin-bottom: 1.75rem; border-bottom: 1px solid var(--border-subtle);"></p>
            <div id="post-content" style="color: var(--text-secondary); font-size: 1.05rem; line-height: 1.85; white-space: pre-line;"></div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 DevBlog. All rights reserved.</p>
    </footer>

     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
